<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Galaxy Digital Clock</title>

	<!-- Sci-fi font -->
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

	<div class="hero">

		<!-- Parallax star layers -->
		<div class="stars"></div>
		<div class="stars2"></div>
		<div class="stars3"></div>

		<div class="container">
			<div class="clock-toolbar">
				<span class="local-label"><i></i> LOCAL TIME</span>
				<button id="format-toggle" type="button" aria-pressed="false">12-hour format</button>
			</div>

		    <div class="clock" role="timer" aria-label="Current local time" aria-live="off">
			    <span id="hrs">00</span>
			    <span class="colon">:</span>
			    <span id="min">00</span>
			    <span class="colon">:</span>
			    <span id="sec">00</span>
				<div class="seconds-track" aria-hidden="true"><div id="seconds-progress"></div></div>
		    </div>

		    <!-- Date below clock -->
		    <div id="date" class="date-text"></div>
			<div id="timezone" class="timezone"></div>

		</div>
    </div>


<script src="clock.js"></script>

</body>
</html>
